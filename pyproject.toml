[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "t-sensor"
version = "0.1.0"
description = "ESP32 Modbus soil telemetry and a small Python data pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "SQLAlchemy==2.1.4",
  "psycopg[binary]==3.3.6", "pandas==3.0.6", "numpy==2.5.3",
  "httpx==0.28.1", "pyserial==3.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
include = ["tsensor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
